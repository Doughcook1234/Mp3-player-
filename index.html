<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My MP3 Playlist</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #101114; color: #f5f5f5; min-height: 100vh;
  }
  .app { max-width: 900px; margin: auto; padding: 24px 16px 120px; }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:20px; }
  h1 { margin:0; font-size:28px; }
  button, .file-label {
    border:0; border-radius:10px; padding:11px 15px; background:#272a31;
    color:white; cursor:pointer; font-weight:600;
  }
  button:hover, .file-label:hover { background:#343842; }
  .add { background:#4f46e5; }
  input[type=file] { display:none; }
  .drop {
    border:2px dashed #3a3d46; border-radius:16px; padding:35px 18px;
    text-align:center; margin-bottom:22px; background:#17191e;
  }
  .drop.drag { border-color:#818cf8; background:#1c1d2b; }
  .drop p { margin:8px 0 16px; color:#aaa; }
  .playlist { background:#17191e; border-radius:16px; overflow:hidden; }
  .empty { padding:45px 20px; text-align:center; color:#999; }
  .track {
    display:grid; grid-template-columns:48px 1fr auto; gap:12px; align-items:center;
    padding:12px 15px; border-bottom:1px solid #292c33;
  }
  .track:last-child { border-bottom:0; }
  .num { color:#777; text-align:center; }
  .info { min-width:0; }
  .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .meta { color:#888; font-size:13px; margin-top:3px; }
  .actions { display:flex; gap:6px; }
  .actions button { padding:8px 10px; font-size:13px; }
  .play { background:#272a31; }
  .remove { color:#ff8b8b; }
  .player {
    position:fixed; bottom:0; left:0; right:0; background:#181a20;
    border-top:1px solid #30333b; padding:12px 16px; z-index:5;
  }
  .player-inner { max-width:900px; margin:auto; }
  #nowPlaying { font-size:14px; margin-bottom:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  audio { width:100%; height:38px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px; }
  .count { color:#888; font-size:14px; }
  @media (max-width:600px) {
    header { align-items:flex-start; flex-direction:column; }
    .track { grid-template-columns:34px 1fr; }
    .actions { grid-column:2; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎵 My MP3 Playlist</h1>
    <label class="file-label add">＋ Add MP3 files
      <input id="fileInput" type="file" accept=".mp3,audio/mpeg" multiple>
    </label>
  </header>

  <div id="dropZone" class="drop">
    <div style="font-size:34px">🎶</div>
    <strong>Drop MP3 files here</strong>
    <p>or use the Add MP3 files button</p>
  </div>

  <div class="bar">
    <strong>Playlist</strong>
    <span id="count" class="count">0 songs</span>
  </div>

  <div id="playlist" class="playlist">
    <div id="empty" class="empty">Your playlist is empty.</div>
  </div>
</div>

<div class="player">
  <div class="player-inner">
    <div id="nowPlaying">Nothing playing</div>
    <audio id="audio" controls></audio>
  </div>
</div>

<script>
const input = document.getElementById('fileInput');
const drop = document.getElementById('dropZone');
const playlistEl = document.getElementById('playlist');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const audio = document.getElementById('audio');
const nowPlaying = document.getElementById('nowPlaying');

let tracks = [];
let current = -1;

function addFiles(files) {
  [...files].filter(f => f.type === 'audio/mpeg' || f.name.toLowerCase().endsWith('.mp3'))
    .forEach(file => tracks.push({
      file,
      name: file.name.replace(/\\.mp3$/i, ''),
      url: URL.createObjectURL(file)
    }));
  render();
}

function play(index) {
  if (!tracks[index]) return;
  current = index;
  audio.src = tracks[index].url;
  nowPlaying.textContent = '▶ ' + tracks[index].name;
  audio.play().catch(() => {});
  render();
}

function removeTrack(index) {
  if (current === index) {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    current = -1; nowPlaying.textContent = 'Nothing playing';
  } else if (current > index) current--;
  URL.revokeObjectURL(tracks[index].url);
  tracks.splice(index, 1);
  render();
}

function move(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= tracks.length) return;
  [tracks[index], tracks[target]] = [tracks[target], tracks[index]];
  if (current === index) current = target;
  else if (current === target) current = index;
  render();
}

function render() {
  countEl.textContent = `${tracks.length} song${tracks.length === 1 ? '' : 's'}`;
  playlistEl.innerHTML = '';
  if (!tracks.length) {
    playlistEl.appendChild(emptyEl);
    return;
  }

  tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track';
    row.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="info">
        <div class="name">${escapeHtml(t.name)}</div>
        <div class="meta">${formatSize(t.file.size)}${i === current ? ' · Playing' : ''}</div>
      </div>
      <div class="actions">
        <button class="play">${i === current && !audio.paused ? 'Pause' : 'Play'}</button>
        <button title="Move up">↑</button>
        <button title="Move down">↓</button>
        <button class="remove">Remove</button>
      </div>`;
    const buttons = row.querySelectorAll('button');
    buttons[0].onclick = () => {
      if (i === current && !audio.paused) audio.pause();
      else play(i);
      render();
    };
    buttons[1].onclick = () => move(i, -1);
    buttons[2].onclick = () => move(i, 1);
    buttons[3].onclick = () => removeTrack(i);
    playlistEl.appendChild(row);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function formatSize(bytes) {
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

input.addEventListener('change', e => addFiles(e.target.files));
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

audio.addEventListener('ended', () => {
  if (current >= 0 && current + 1 < tracks.length) play(current + 1);
  else { current = -1; nowPlaying.textContent = 'Playlist finished'; render(); }
});
audio.addEventListener('play', render);
audio.addEventListener('pause', render);

render();
</script>
</body>
</html>
